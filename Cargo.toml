[package]
name = "rag"
version = "0.1.4"
edition = "2024"
description = "A Rust library and CLI for Retrieval-Augmented Generation"
license = "Apache-2.0"
repository = "https://github.com/yingkitw/rag"
homepage = "https://github.com/yingkitw/rag"
documentation = "https://docs.rs/rag"
categories = ["text-processing", "data-structures", "algorithms"]
keywords = ["rag", "retrieval", "vector-search", "mcp", "llm"]

[lib]
name = "rag"
path = "src/lib.rs"

[[bin]]
name = "rag"
path = "src/main.rs"
required-features = ["cli"]

[[bin]]
name = "rag-mcp"
path = "src/mcp_server.rs"
required-features = ["mcp"]

[dependencies]
tokio = { version = "1.35", features = ["rt-multi-thread", "macros", "fs"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
uuid = { version = "1.6", features = ["v4", "serde"] }
async-trait = "0.1"
dashmap = "5.5"
tracing = "0.1"
urlencoding = "2.1"

# Optional: CLI binaries
clap = { version = "4.4", features = ["derive", "env"], optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }

# Optional: HTTP-based embedding models, rerankers, query rewriting, contextual retrieval
reqwest = { version = "0.11", features = ["json"], optional = true }

# Optional: HNSW approximate index
hnsw_rs = { version = "0.3", optional = true }

# Optional: PDF ingestion
lopdf = { version = "0.32", optional = true }

# Optional: Codebase / directory tree ingestion
walkdir = { version = "2.5", optional = true }

# Optional: MCP server protocol
rmcp = { version = "1.6", features = ["server", "macros", "transport-io", "schemars"], optional = true }
schemars = { version = "1.0", optional = true }

[dev-dependencies]
tempfile = "3.8"

[features]
default = ["http", "hnsw", "ingest", "pdf", "mcp", "cli"]
http = ["dep:reqwest"]
hnsw = ["dep:hnsw_rs"]
pdf = ["dep:lopdf"]
ingest = ["dep:walkdir"]
mcp = ["dep:rmcp", "dep:schemars", "dep:tracing-subscriber", "http"]
cli = ["dep:clap", "dep:tracing-subscriber", "http"]
openai = ["http"]
ollama = ["http"]
llm-extractor = ["http"]

[[example]]
name = "simple_rag"
path = "examples/simple_rag.rs"
required-features = ["http"]

[[example]]
name = "advanced_vector_store"
path = "examples/advanced_vector_store.rs"

[[example]]
name = "batch_search"
path = "examples/batch_search.rs"

[[example]]
name = "distance_metrics"
path = "examples/distance_metrics.rs"

[[example]]
