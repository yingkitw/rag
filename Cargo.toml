[package]
name = "rag"
version = "0.1.5"
edition = "2024"
description = "A Rust library and CLI for Retrieval-Augmented Generation"
license = "Apache-2.0"
repository = "https://github.com/yingkitw/rag"
homepage = "https://github.com/yingkitw/rag"
documentation = "https://docs.rs/rag"
categories = ["text-processing", "data-structures", "algorithms"]
keywords = ["rag", "retrieval", "vector-search", "mcp", "llm"]

[lib]
name = "rag"
path = "src/lib.rs"

[[bin]]
name = "rag"
path = "src/main.rs"
required-features = ["cli"]

[[bin]]
name = "rag-mcp"
path = "src/mcp_server.rs"
required-features = ["mcp"]

[dependencies]
tokio = { version = "1.35", features = ["rt-multi-thread", "macros", "fs"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Optional: structured logging
tracing = { version = "0.1", optional = true }

# Optional: CLI binaries
clap = { version = "4.4", features = ["derive", "env"], optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }

# Optional: HTTP-based embedding models, rerankers, query rewriting, contextual retrieval
# rustls-tls avoids native-tls/openssl (smaller, portable, bundled roots);
# default-features disabled drops unused http2/charset/macos-system-configuration.
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"], optional = true }

# Optional: HNSW approximate index
hnsw_rs = { version = "0.3", optional = true }

# Optional: PDF ingestion
lopdf = { version = "0.32", optional = true }

# Optional: MCP server protocol
rmcp = { version = "1.6", features = ["server", "macros", "transport-io", "schemars"], optional = true }
schemars = { version = "1.0", optional = true }

# Optional: SQLite persistent vector backend
rusqlite = { version = "0.32", features = ["bundled"], optional = true }

# Optional: PostgreSQL vector backend
tokio-postgres = { version = "0.7", features = ["runtime"], optional = true }
pgvector = { version = "0.3", features = ["postgres"], optional = true }

# Optional: compression for persistence files
zstd = { version = "0.13", optional = true }

# Optional: local ONNX embeddings / reranker / image embeddings (no network at inference)
fastembed = { version = "4", optional = true }

[dev-dependencies]
tempfile = "3.8"

[features]
default = ["http", "hnsw", "ingest", "pdf", "mcp", "cli"]
http = ["dep:reqwest"]
hnsw = ["dep:hnsw_rs"]
pdf = ["dep:lopdf"]
ingest = []
mcp = ["dep:rmcp", "dep:schemars", "dep:tracing-subscriber", "dep:tracing", "http"]
cli = ["dep:clap", "dep:tracing-subscriber", "http"]
sqlite = ["dep:rusqlite"]
qdrant = ["dep:reqwest"]
postgres = ["dep:tokio-postgres", "dep:pgvector"]
openai = ["http"]
ollama = ["http"]
llm-extractor = ["http"]
compress = ["dep:zstd"]
fastembed = ["dep:fastembed"]
image-embeddings = ["fastembed"]

