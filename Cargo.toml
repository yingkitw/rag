# --- Build size optimization ---
# Aggressive size reduction for release artifacts (binaries + release-built lib).
# `cargo test` is unaffected: the `test` profile inherits from `dev` (unwinding),
# so the lib is recompiled for tests without these settings.
[profile.release]
opt-level = "z"      # optimize for binary size
lto = true           # fat link-time optimization across the whole dependency graph
codegen-units = 1    # single codegen unit -> better dead-code elimination & inlining
strip = true         # strip debug symbols from the final binary
panic = "abort"      # drop unwind tables and landing pads